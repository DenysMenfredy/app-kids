name: lele
description: "Lelê — Brazilian literacy app for children ages 3-7. Learn to read through play."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  audioplayers: ^6.8.1
  cloud_firestore: ^6.8.0
  cloud_functions: ^6.3.6
  equatable: ^2.1.0
  # Keep these aligned with FlutterFire's compatible release set: App Check
  # 0.4.8 allows Core 4.15, which mismatches Auth 6.5.7's Android API.
  firebase_app_check: 0.4.6
  firebase_auth: ^6.5.7
  firebase_core: 4.13.0
  firebase_messaging: ^16.0.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_tts: ^4.2.5
  go_router: ^17.2.3
  shared_preferences: ^2.5.5
  sign_in_with_apple: ^8.2.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/onboarding/
    # Google's official "G" mark, with its 2.0x/3.0x density variants
    # alongside. See assets/images/google/README.md before touching these.
    - assets/images/google/

  fonts:
    - family: Baloo 2
      fonts:
        - asset: assets/fonts/Baloo2-Medium.ttf
          weight: 500
        - asset: assets/fonts/Baloo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
