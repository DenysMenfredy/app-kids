include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # The app is pt-BR only today, but a missing `await` on a Firestore or
    # Auth call fails silently and is exactly the class of bug the unit
    # tests cannot see.
    unawaited_futures: error
    # A dangling BuildContext after an await is how the auth screens would
    # crash on a slow connection.
    use_build_context_synchronously: error
  exclude:
    - lib/firebase_options.dart
    - build/**
    - android/**
    - ios/**
    - web/**

linter:
  rules:
    # --- correctness ---
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - no_literal_bool_comparisons
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_statements

    # --- Flutter ---
    - avoid_unnecessary_containers
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - sized_box_for_whitespace
    - use_colored_box
    - use_decorated_box

    # --- consistency ---
    - directives_ordering
    - omit_local_variable_types
    - prefer_final_locals
    - prefer_relative_imports
    - prefer_single_quotes
    - unnecessary_parenthesis
    - unnecessary_raw_strings
