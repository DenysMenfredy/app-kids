name: Release Android

# Signing: android/app/build.gradle.kts reads android/key.properties, which the
# "Restore the upload keystore" step below writes from this Environment's
# secrets. If those secrets are missing the build does not silently fall back —
# key.properties would be incomplete and Gradle fails naming the missing key.
on:
  workflow_dispatch:
    inputs:
      distribute:
        description: Send the APK to Firebase App Distribution testers
        type: boolean
        default: true
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build signed Android release
    runs-on: ubuntu-latest
    # The upload keystore lives in this Environment's secrets.
    environment: production
    defaults:
      run:
        working-directory: lele
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - run: flutter pub get

      # A release is the wrong place to discover a red test.
      - run: flutter test

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          # Quoted heredoc: the values are written, never expanded into logs.
          cat > android/key.properties <<'PROPS'
          storeFile=upload-keystore.jks
          PROPS
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } >> android/key.properties

      - name: Build the app bundle (Play) and APK (testers)
        run: |
          flutter build appbundle --release --dart-define=USE_FIREBASE=true
          flutter build apk --release --dart-define=USE_FIREBASE=true

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            lele/build/app/outputs/bundle/release/app-release.aab
            lele/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - uses: google-github-actions/auth@v2
        if: inputs.distribute || startsWith(github.ref, 'refs/tags/')
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Hand the build to the tester group
        if: inputs.distribute || startsWith(github.ref, 'refs/tags/')
        run: |
          npx --yes firebase-tools@13 appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app ${{ vars.FIREBASE_ANDROID_APP_ID }} \
            --groups testers \
            --release-notes "${{ github.ref_name }} (${{ github.sha }})" \
            --project production

      - name: Shred the signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
